[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smscleanup"
version = "0.1.0"
description = "Remove redundant full SMS/MMS/call-log XML backups without losing messages"
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
smscleanup = "smscleanup.cli:main"

[tool.setuptools]
packages = ["smscleanup"]
